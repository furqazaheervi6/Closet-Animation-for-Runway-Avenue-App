<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Runway Avenue – Upload to Closet</title>
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&f[]=satoshi@300,400,500&display=swap" rel="stylesheet">
  <style>
    :root{
      --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
      --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
      --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
      --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --text-2xl:clamp(2rem,1.2rem + 2.5vw,3.5rem);
      --sp1:.25rem;--sp2:.5rem;--sp3:.75rem;--sp4:1rem;--sp5:1.25rem;--sp6:1.5rem;
      --sp8:2rem;--sp10:2.5rem;--sp12:3rem;--sp16:4rem;
      --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-2xl:1.5rem;--r-full:9999px;
      --tr:180ms cubic-bezier(0.16,1,0.3,1);
      --fd:'Cabinet Grotesk','Helvetica Neue',sans-serif;
      --fb:'Satoshi','Inter',sans-serif;
    }
    [data-theme="dark"]{
      --bg:#0e0d0c;--sf:#141312;--sf2:#1a1917;--sfo:#201f1c;--sfd:#2a2926;
      --dv:#2e2c29;--bd:#3a3835;
      --tx:#e8e6e2;--txm:#8a8884;--txf:#4e4c4a;--txi:#111110;
      --pr:#c9a96e;--prh:#e0c48a;--prhl:#2a2318;
      --shsm:0 1px 2px oklch(0 0 0/.3);
      --shmd:0 4px 16px oklch(0 0 0/.4);
      --shlg:0 16px 48px oklch(0 0 0/.55);
      --shgw:0 0 40px oklch(0.7 0.1 70/.15);
      --tooltip-bg:#1e1d1b;
    }
    [data-theme="light"]{
      --bg:#faf9f6;--sf:#f5f4f0;--sf2:#efede8;--sfo:#e8e5de;--sfd:#ddd9d1;
      --dv:#d4d0c8;--bd:#c8c4bb;
      --tx:#1a1816;--txm:#6b6860;--txf:#aaa89f;--txi:#f5f4f0;
      --pr:#9a7440;--prh:#7d5e30;--prhl:#f0e8d8;
      --shsm:0 1px 2px oklch(0.2 0.01 80/.06);
      --shmd:0 4px 12px oklch(0.2 0.01 80/.08);
      --shlg:0 12px 32px oklch(0.2 0.01 80/.12);
      --shgw:0 0 32px oklch(0.6 0.1 70/.1);
      --tooltip-bg:#ffffff;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
    body{min-height:100dvh;font-family:var(--fb);font-size:var(--text-base);color:var(--tx);background:var(--bg);overflow-x:hidden}
    img{display:block;max-width:100%}
    button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--pr);outline-offset:3px;border-radius:var(--r-sm)}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    .page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:var(--sp8) var(--sp4);padding-top:80px}
    .header{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:var(--sp4) var(--sp8);background:color-mix(in oklch,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--dv)}
    .logo{display:flex;align-items:center;gap:var(--sp3);font-family:var(--fd);font-weight:800;font-size:var(--text-lg);letter-spacing:-.02em;color:var(--tx);text-decoration:none}
    .logo-mark{width:32px;height:32px;flex-shrink:0}
    .theme-toggle{width:40px;height:40px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:var(--txm);transition:background var(--tr),color var(--tr)}
    .theme-toggle:hover{background:var(--sfo);color:var(--tx)}
    .sec-label{font-size:var(--text-xs);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--pr);margin-bottom:var(--sp3)}
    .sec-title{font-family:var(--fd);font-size:var(--text-2xl);font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--tx);margin-bottom:var(--sp4)}
    .sec-sub{font-size:var(--text-sm);color:var(--txm);max-width:44ch;line-height:1.7;margin-bottom:var(--sp8)}
    .stage{width:100%;max-width:880px;text-align:center}

    .closet-scene{position:relative;width:100%;aspect-ratio:16/9;max-height:460px;border-radius:var(--r-2xl);background:var(--sf);border:1px solid var(--bd);box-shadow:var(--shlg),var(--shgw);overflow:visible;display:flex;align-items:center;justify-content:center}
    .closet-inner{position:absolute;inset:0;border-radius:var(--r-2xl);overflow:hidden}
    .closet-inner::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 56px,rgba(255,255,255,.012) 56px,rgba(255,255,255,.012) 58px),repeating-linear-gradient(180deg,transparent 0px,transparent 96px,rgba(255,255,255,.008) 96px,rgba(255,255,255,.008) 98px)}
    .closet-inner::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,169,110,.04) 0%,transparent 70%)}
    .closet-panel{position:absolute;top:0;bottom:0;width:7%;border:1px solid var(--bd)}
    .closet-panel.left{left:0;border-radius:var(--r-2xl) 0 0 var(--r-2xl);background:linear-gradient(90deg,var(--sfd) 0%,var(--sf) 100%)}
    .closet-panel.right{right:0;border-radius:0 var(--r-2xl) var(--r-2xl) 0;background:linear-gradient(270deg,var(--sfd) 0%,var(--sf) 100%)}
    .closet-rod{position:absolute;top:22%;left:7%;right:7%;height:7px;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,var(--sfd) 40%,var(--bd) 80%,var(--sfo) 100%);border-radius:var(--r-full);box-shadow:0 3px 10px oklch(0 0 0/.35),inset 0 1px 0 rgba(255,255,255,.14);z-index:5}
    .closet-rod::before,.closet-rod::after{content:'';position:absolute;top:-14px;width:16px;height:22px;background:linear-gradient(180deg,var(--sfd),var(--bd));border-radius:var(--r-sm) var(--r-sm) 0 0;border:1px solid var(--bd)}
    .closet-rod::before{left:8%}.closet-rod::after{right:8%}
    .closet-shelf{position:absolute;bottom:12%;left:7%;right:7%;height:9px;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,var(--sfd) 30%,var(--sfo) 100%);border-radius:var(--r-sm);box-shadow:0 4px 14px oklch(0 0 0/.28),inset 0 1px 0 rgba(255,255,255,.1);z-index:5}
    .shelf-items{position:absolute;bottom:17%;left:10%;right:10%;display:flex;gap:1.2%;justify-content:center;align-items:flex-end;z-index:4}
    .folded{width:7%;aspect-ratio:1.2/1;border-radius:4px;box-shadow:var(--shmd)}
    .f-denim{background:linear-gradient(160deg,#2d4a7a,#1e3560)}
    .f-white{background:linear-gradient(160deg,#e8e6e0,#d4d0c8)}
    .f-olive{background:linear-gradient(160deg,#5a6b3a,#3e4d28)}
    .f-rust{background:linear-gradient(160deg,#a84c1e,#7a3210)}

    .hangers-wrap{position:absolute;top:0;left:7%;right:7%;bottom:0;display:flex;align-items:flex-start;justify-content:space-around;padding-top:10%;z-index:10}
    .hanger-slot{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);width:11%}
    .hanger-slot:hover{transform:translateY(-12px) scale(1.08);z-index:50}
    .hanger-slot:focus-visible{transform:translateY(-12px) scale(1.08);z-index:50;outline:2px solid var(--pr);outline-offset:4px;border-radius:var(--r-md)}
    .hanger-hook{width:100%;max-width:52px;height:auto;flex-shrink:0}
    .garment-wrap{position:relative;width:100%;display:flex;align-items:center;justify-content:center}
    .garment-svg{width:80%;max-width:68px;height:auto;filter:drop-shadow(0 4px 12px oklch(0 0 0/.35));transition:filter .3s}
    .hanger-slot:hover .garment-svg{filter:drop-shadow(0 8px 20px oklch(0 0 0/.5))}
    .garment.is-hanging{animation:swing 5s ease-in-out infinite}
    @keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

    .item-tooltip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--tooltip-bg);border:1px solid var(--bd);border-radius:var(--r-xl);padding:var(--sp3) var(--sp4);min-width:140px;max-width:180px;box-shadow:var(--shlg);pointer-events:none;opacity:0;transition:opacity .22s var(--tr),transform .22s var(--tr);z-index:300;text-align:left;backdrop-filter:blur(12px)}
    .item-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--bd)}
    .item-tooltip::before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-1px;border:6px solid transparent;border-top-color:var(--tooltip-bg);z-index:1}
    .hanger-slot:hover .item-tooltip,.hanger-slot:focus-visible .item-tooltip{opacity:1;transform:translateX(-50%) translateY(0)}
    .tt-type{font-size:var(--text-xs);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--pr);margin-bottom:2px}
    .tt-name{font-family:var(--fd);font-size:var(--text-sm);font-weight:700;color:var(--tx);margin-bottom:var(--sp1);line-height:1.2}
    .tt-desc{font-size:var(--text-xs);color:var(--txm);line-height:1.5}
    .tt-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--sp2)}
    .tt-tag{font-size:10px;font-weight:500;letter-spacing:.04em;padding:2px 7px;border-radius:var(--r-full);background:var(--prhl);color:var(--pr);border:1px solid rgba(201,169,110,.2)}

    .upload-card{position:absolute;width:9%;max-width:72px;border-radius:var(--r-lg);overflow:hidden;transform-origin:top center;z-index:20;pointer-events:none;opacity:0;box-shadow:var(--shlg)}
    .upload-card svg{width:100%;height:auto;display:block}
    .sparkle-wrap{position:absolute;inset:0;pointer-events:none;z-index:30}
    .sparkle{position:absolute;border-radius:var(--r-full);background:var(--pr);opacity:0}

    .upload-zone{margin-top:var(--sp6);border:2px dashed var(--bd);border-radius:var(--r-xl);padding:var(--sp8) var(--sp6);text-align:center;cursor:pointer;position:relative;background:var(--sf);transition:border-color var(--tr),background var(--tr),box-shadow var(--tr);overflow:hidden}
    .upload-zone:hover,.upload-zone.drag{border-color:var(--pr);background:var(--prhl);box-shadow:0 0 0 4px rgba(201,169,110,.08)}
    .upload-zone:active{transform:scale(.99)}
    .upload-zone::after{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--pr),transparent);top:0;opacity:0;transform:translateY(0)}
    .upload-zone.scanning::after{animation:scan 1.2s cubic-bezier(.4,0,.6,1) forwards}
    @keyframes scan{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}80%{opacity:.9}100%{opacity:0;transform:translateY(220px)}}
    .up-icon{width:44px;height:44px;margin:0 auto var(--sp3);color:var(--txm);transition:color var(--tr),transform var(--tr)}
    .upload-zone:hover .up-icon,.upload-zone.drag .up-icon{color:var(--pr);transform:translateY(-4px)}
    .up-label{font-size:var(--text-sm);font-weight:600;color:var(--tx);margin-bottom:var(--sp1);font-family:var(--fd)}
    .up-hint{font-size:var(--text-xs);color:var(--txm)}
    .up-hint span{color:var(--pr);font-weight:500}

    .btn-p{display:inline-flex;align-items:center;gap:var(--sp2);padding:var(--sp3) var(--sp8);background:var(--pr);color:var(--txi);border-radius:var(--r-full);font-family:var(--fd);font-weight:700;font-size:var(--text-sm);letter-spacing:.02em;box-shadow:var(--shmd);transition:background var(--tr),transform var(--tr),box-shadow var(--tr);margin-top:var(--sp6)}
    .btn-p:hover{background:var(--prh);transform:translateY(-2px);box-shadow:var(--shlg)}
    .btn-p:active{transform:translateY(0)}
    [data-theme="light"] .btn-p{color:#faf9f6}
    .steps{display:flex;align-items:center;gap:var(--sp2);justify-content:center;margin-top:var(--sp5)}
    .pill{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp1) var(--sp3);border-radius:var(--r-full);font-size:var(--text-xs);font-weight:500;background:var(--sf2);color:var(--txm);border:1px solid var(--bd);transition:background var(--tr),color var(--tr),border-color var(--tr)}
    .pill.on,.pill.done{background:var(--prhl);color:var(--pr);border-color:rgba(201,169,110,.3)}
    .dot{width:6px;height:6px;border-radius:var(--r-full);background:currentColor;flex-shrink:0}
    .conn{width:24px;height:1px;background:var(--bd)}
    .confetti-p{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:999;opacity:0}
    .toast{position:fixed;bottom:var(--sp8);left:50%;transform:translateX(-50%) translateY(80px);background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r-xl);padding:var(--sp3) var(--sp6);font-size:var(--text-sm);font-weight:500;color:var(--tx);box-shadow:var(--shlg);z-index:500;display:flex;align-items:center;gap:var(--sp3);opacity:0;transition:transform .4s cubic-bezier(0.16,1,0.3,1),opacity .4s;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    .ti{color:var(--pr);flex-shrink:0}
    @media(max-width:640px){.sec-title{font-size:var(--text-xl)}.hanger-slot{width:13%}.item-tooltip{min-width:120px;font-size:.7rem}}
  </style>
</head>
<body>
<header class="header">
  <a href="#" class="logo" aria-label="Runway Avenue">
    <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="var(--pr)" opacity="0.15"/>
      <path d="M16 4C16 4 19 4 19 7C19 9.5 16.5 10 16.5 10L22 10L22 28M16.5 10L22 28" stroke="var(--pr)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M10 10L10 28" stroke="var(--pr)" stroke-width="2" stroke-linecap="round"/>
      <path d="M9 4C12 4 16 4 16 7C16 8.5 14.5 10 12.5 10L10 10" stroke="var(--pr)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    Runway Avenue
  </a>
  <button class="theme-toggle" data-theme-toggle aria-label="Switch to light mode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</header>

<main class="page">
  <div class="stage">
    <p class="sec-label">Feature Animation &mdash; Task 1</p>
    <h1 class="sec-title">Upload to Your Closet</h1>
    <p class="sec-sub">Drag, drop, and watch your pieces find their place. Hover any item to explore your wardrobe.</p>
    <div class="closet-scene" id="cs" aria-label="Animated digital closet">
      <div class="closet-inner">
        <div class="closet-panel left"></div>
        <div class="closet-panel right"></div>
        <div class="closet-rod"></div>
        <div class="closet-shelf"></div>
        <div class="shelf-items">
          <div class="folded f-denim"></div>
          <div class="folded f-white"></div>
          <div class="folded f-olive"></div>
          <div class="folded f-rust"></div>
          <div class="folded f-denim"></div>
        </div>
      </div>
      <div class="hangers-wrap" id="hw"></div>
      <div class="sparkle-wrap" id="sw"></div>
      <div class="upload-card" id="uc"></div>
    </div>
    <div class="upload-zone" id="uz" role="button" tabindex="0" aria-label="Upload clothing item">
      <svg class="up-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 32V16M17 23l7-7 7 7"/><path d="M8 36c0-4 2-8 8-9a10 10 0 0 1 16 0c6 1 8 5 8 9"/>
        <rect x="4" y="36" width="40" height="8" rx="4"/>
      </svg>
      <p class="up-label">Drop your item here</p>
      <p class="up-hint">JPEG, PNG, HEIC &nbsp;&middot;&nbsp; <span>Browse files</span></p>
    </div>
    <div class="steps">
      <div class="pill on" id="s1"><span class="dot"></span> Upload</div>
      <div class="conn"></div>
      <div class="pill" id="s2"><span class="dot"></span> Detect</div>
      <div class="conn"></div>
      <div class="pill" id="s3"><span class="dot"></span> Hang</div>
    </div>
    <button class="btn-p" id="db" aria-label="Preview animation">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
      Preview Animation
    </button>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg class="ti" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20,6 9,17 4,12"/></svg>
  <span id="tm">Item added to your closet!</span>
</div>

<script>
(function(){
  const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
  let d='dark';r.setAttribute('data-theme',d);
  if(!t)return;
  t.addEventListener('click',()=>{
    d=d==='dark'?'light':'dark';r.setAttribute('data-theme',d);
    t.setAttribute('aria-label','Switch to '+(d==='dark'?'light':'dark')+' mode');
    t.innerHTML=d==='dark'
      ?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  });
})();

const ITEMS=[
  {type:'Outerwear',name:'Wool Overcoat',color:'#2c3e50',color2:'#1a252f',tags:['Winter','Formal','Layering'],desc:'A structured double-breasted coat in deep midnight navy. Perfect for cold-weather dressing.',svgType:'coat'},
  {type:'Top',name:'Silk Blouse',color:'#e8d5c4',color2:'#d4bca8',tags:['Casual','Office','Spring'],desc:'Flowy ivory silk with a relaxed drape. Transitions effortlessly from desk to dinner.',svgType:'blouse'},
  {type:'Bottoms',name:'Tailored Trousers',color:'#3d3d3d',color2:'#282828',tags:['Formal','Versatile','Year-round'],desc:'Slim-cut charcoal trousers with a high waist. The foundation of any polished look.',svgType:'trousers'},
  {type:'Dress',name:'Wrap Dress',color:'#7a4a6e',color2:'#5a3050',tags:['Evening','Date Night','Summer'],desc:'A deep plum wrap silhouette that flatters every figure. Effortless and elevated.',svgType:'dress'},
  {type:'Top',name:'Linen Shirt',color:'#c4a882',color2:'#a88a64',tags:['Casual','Beach','Summer'],desc:'Breathable caramel linen with a relaxed fit. Weekend-ready with chinos or shorts.',svgType:'shirt'},
  {type:'Bottoms',name:'Denim Shorts',color:'#4a6fa5',color2:'#305080',tags:['Casual','Summer','Beach'],desc:'Vintage-washed mid-rise denim. The ultimate warm-weather essential.',svgType:'shorts'}
];

function makeSVG(type,c1,c2){
  const id='g'+Math.random().toString(36).slice(2,6);
  const sdefs=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient><linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(255,255,255,0.12)"/><stop offset="50%" stop-color="rgba(255,255,255,0.04)"/><stop offset="100%" stop-color="rgba(0,0,0,0.08)"/></linearGradient></defs>`;
  const shapes={
    coat:`<svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">${sdefs}<path d="M10 20 L5 30 L5 85 L28 85 L28 45 L30 45 L32 85 L55 85 L55 30 L50 20 L40 15 L36 22 L30 25 L24 22 L20 15 Z" fill="url(#${id})"/><path d="M24 22 L28 45 L30 45 L32 45 L36 22 L30 25 Z" fill="${c2}" opacity="0.6"/><path d="M22 18 L24 22 L30 25 L36 22 L38 18 L30 16 Z" fill="${c2}" opacity="0.8"/><path d="M10 20 L5 30 L8 55 L14 53 L18 30 L20 15 Z" fill="url(#${id})"/><path d="M50 20 L55 30 L52 55 L46 53 L42 30 L40 15 Z" fill="url(#${id})"/><line x1="30" y1="26" x2="30" y2="82" stroke="rgba(255,255,255,0.15)" stroke-width="1"/><circle cx="30" cy="35" r="1.5" fill="rgba(255,255,255,0.25)"/><circle cx="30" cy="48" r="1.5" fill="rgba(255,255,255,0.25)"/><circle cx="30" cy="61" r="1.5" fill="rgba(255,255,255,0.25)"/><circle cx="30" cy="74" r="1.5" fill="rgba(255,255,255,0.25)"/><path d="M10 20 L5 85 L55 85 L55 20 L40 15 L30 16 L20 15 Z" fill="url(#${id}s)" opacity="0.5"/></svg>`,
    blouse:`<svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">${sdefs}<path d="M15 18 L8 28 L6 75 L54 75 L52 28 L45 18 L38 14 L30 17 L22 14 Z" fill="url(#${id})"/><path d="M15 18 L8 28 L5 38 L12 40 L18 26 L22 14 Z" fill="url(#${id})"/><path d="M45 18 L52 28 L55 38 L48 40 L42 26 L38 14 Z" fill="url(#${id})"/><path d="M22 14 L30 32 L38 14 L30 17 Z" fill="${c2}" opacity="0.5"/><path d="M6 70 Q15 66 24 70 Q33 74 42 70 Q51 66 54 70 L54 75 L6 75 Z" fill="${c2}" opacity="0.4"/><path d="M15 18 L6 75 L54 75 L45 18 Z" fill="url(#${id}s)" opacity="0.45"/></svg>`,
    trousers:`<svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">${sdefs}<rect x="8" y="12" width="44" height="10" rx="2" fill="${c2}" opacity="0.9"/><path d="M8 22 L12 85 L30 85 L30 50 L26 22 Z" fill="url(#${id})"/><path d="M52 22 L48 85 L30 85 L30 50 L34 22 Z" fill="url(#${id})"/><line x1="30" y1="22" x2="30" y2="85" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/><rect x="14" y="11" width="3" height="7" rx="1" fill="rgba(255,255,255,0.2)"/><rect x="27" y="11" width="3" height="7" rx="1" fill="rgba(255,255,255,0.2)"/><rect x="43" y="11" width="3" height="7" rx="1" fill="rgba(255,255,255,0.2)"/><path d="M38 24 Q44 26 46 32" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/><path d="M8 22 L12 85 L48 85 L52 22 Z" fill="url(#${id}s)" opacity="0.4"/></svg>`,
    dress:`<svg viewBox="0 0 60 95" xmlns="http://www.w3.org/2000/svg">${sdefs}<path d="M18 12 L14 28 L20 30 L20 42 L40 42 L40 30 L46 28 L42 12 L36 10 L30 14 L24 10 Z" fill="url(#${id})"/><path d="M20 42 L8 90 L52 90 L40 42 Z" fill="url(#${id})"/><line x1="20" y1="42" x2="40" y2="42" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/><path d="M20 42 Q16 46 10 44" stroke="${c2}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/><path d="M24 10 L30 24 L36 10 L30 14 Z" fill="${c2}" opacity="0.5"/><path d="M20 42 L8 90 L52 90 L40 42 Z" fill="url(#${id}s)" opacity="0.4"/></svg>`,
    shirt:`<svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">${sdefs}<path d="M14 18 L6 26 L6 75 L54 75 L54 26 L46 18 L38 14 L34 20 L30 22 L26 20 L22 14 Z" fill="url(#${id})"/><path d="M14 18 L6 26 L4 60 L12 62 L18 30 L22 14 Z" fill="url(#${id})"/><path d="M46 18 L54 26 L56 60 L48 62 L42 30 L38 14 Z" fill="url(#${id})"/><path d="M22 14 L26 20 L30 22 L34 20 L38 14" stroke="${c2}" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/><line x1="30" y1="22" x2="30" y2="72" stroke="rgba(255,255,255,0.12)" stroke-width="1"/><circle cx="30" cy="30" r="1.2" fill="rgba(255,255,255,0.3)"/><circle cx="30" cy="42" r="1.2" fill="rgba(255,255,255,0.3)"/><circle cx="30" cy="54" r="1.2" fill="rgba(255,255,255,0.3)"/><circle cx="30" cy="66" r="1.2" fill="rgba(255,255,255,0.3)"/><path d="M14 18 L6 75 L54 75 L46 18 Z" fill="url(#${id}s)" opacity="0.4"/></svg>`,
    shorts:`<svg viewBox="0 0 60 65" xmlns="http://www.w3.org/2000/svg">${sdefs}<rect x="6" y="8" width="48" height="11" rx="2" fill="${c2}" opacity="0.9"/><path d="M6 19 L10 60 L30 60 L30 36 L22 19 Z" fill="url(#${id})"/><path d="M54 19 L50 60 L30 60 L30 36 L38 19 Z" fill="url(#${id})"/><path d="M10 56 Q15 52 20 56 Q25 60 30 56 Q35 52 40 56 Q45 60 50 56" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/><rect x="12" y="7" width="3" height="8" rx="1" fill="rgba(255,255,255,0.25)"/><rect x="28" y="7" width="3" height="8" rx="1" fill="rgba(255,255,255,0.25)"/><rect x="45" y="7" width="3" height="8" rx="1" fill="rgba(255,255,255,0.25)"/><path d="M6 19 L10 60 L50 60 L54 19 Z" fill="url(#${id}s)" opacity="0.35"/></svg>`
  };
  return shapes[type]||shapes.shirt;
}

function makeHookSVG(){
  return`<svg class="hanger-hook" viewBox="0 0 52 38" fill="none" aria-hidden="true"><path d="M26 5 C26 5 31 5 31 9 C31 13 26 14 26 14 L4 30 C4 30 2 32 2 34 L50 34 C50 34 50 32 48 30 L26 14" stroke="var(--bd)" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="5" r="3" stroke="var(--bd)" stroke-width="2" fill="none"/></svg>`;
}

function makeSlot(item,idx){
  const s=document.createElement('div');
  s.className='hanger-slot';s.setAttribute('tabindex','0');s.setAttribute('role','button');s.setAttribute('aria-label',item.name);
  const tagHTML=item.tags.map(t=>`<span class="tt-tag">${t}</span>`).join('');
  s.innerHTML=makeHookSVG()+
    `<div class="garment-wrap"><div class="garment is-hanging garment-svg" style="animation-delay:${-(idx*0.8)}s">${makeSVG(item.svgType,item.color,item.color2)}</div>`+
    `<div class="item-tooltip" role="tooltip"><div class="tt-type">${item.type}</div><div class="tt-name">${item.name}</div><div class="tt-desc">${item.desc}</div><div class="tt-tags">${tagHTML}</div></div></div>`;
  return s;
}

const hw=document.getElementById('hw');
ITEMS.forEach((item,i)=>hw.appendChild(makeSlot(item,i)));

const UPC_ITEMS=[
  {color:'#8b6f47',color2:'#6b4f27',svgType:'coat',type:'Outerwear',name:'Caramel Jacket',tags:['Casual','Autumn'],desc:'Warm caramel leather jacket. The season\'s most versatile layer.'},
  {color:'#5a8a6a',color2:'#3a6a4a',svgType:'blouse',type:'Top',name:'Sage Blouse',tags:['Spring','Office'],desc:'Sage green silk. Light, breathable, and effortlessly chic.'},
  {color:'#7a3a3a',color2:'#5a1a1a',svgType:'dress',type:'Dress',name:'Crimson Dress',tags:['Evening','Bold'],desc:'A striking crimson silhouette. Turn heads at any occasion.'},
  {color:'#4a7a9b',color2:'#2a5a7b',svgType:'shirt',type:'Top',name:'Ocean Shirt',tags:['Casual','Beach'],desc:'Cool ocean blue linen. Perfect for sunny weekend escapes.'},
  {color:'#8a7a5a',color2:'#6a5a3a',svgType:'trousers',type:'Bottoms',name:'Sand Trousers',tags:['Neutral','Smart-Casual'],desc:'Sand-toned tailored trousers. The ultimate neutral anchor piece.'},
  {color:'#6a4a8a',color2:'#4a2a6a',svgType:'shorts',type:'Bottoms',name:'Violet Shorts',tags:['Bold','Summer'],desc:'Rich violet shorts. A head-turning summer statement.'},
];
let ci=0,busy=false;

const cs=document.getElementById('cs'),uc=document.getElementById('uc'),uz=document.getElementById('uz');
const db=document.getElementById('db'),s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');
const sw=document.getElementById('sw'),toast=document.getElementById('toast'),tm=document.getElementById('tm');

function step(n){[s1,s2,s3].forEach((s,i)=>{s.classList.remove('on','done');if(i<n-1)s.classList.add('done');if(i===n-1)s.classList.add('on');})} 
function showToast(msg){tm.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800);}
function sparkles(x,y){for(let i=0;i<12;i++){const el=document.createElement('div');el.className='sparkle';const a=(i/12)*Math.PI*2,d=20+Math.random()*30,tx=Math.cos(a)*d,ty=Math.sin(a)*d,sz=3+Math.random()*5;el.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px`;sw.appendChild(el);el.animate([{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:0,transform:`translate(${tx}px,${ty}px) scale(0)`}],{duration:600+Math.random()*300,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'}).finished.then(()=>el.remove());}}
function confetti(){const cols=['#c9a96e','#e0c48a','#8aaa8a','#d4a0a0','#6e8e6e','#a06060','#6080a0'];for(let i=0;i<26;i++){const p=document.createElement('div');p.className='confetti-p';p.style.cssText=`background:${cols[i%cols.length]};left:${15+Math.random()*70}vw;top:-20px;border-radius:${Math.random()>.5?'50%':'3px'}`;document.body.appendChild(p);const dr=(Math.random()-.5)*200,sp=(Math.random()-.5)*720;p.animate([{opacity:1,transform:'translateY(0) rotate(0deg)'},{opacity:0,transform:`translateY(100vh) translateX(${dr}px) rotate(${sp}deg)`}],{duration:1500+Math.random()*800,delay:Math.random()*300,easing:'cubic-bezier(0.22,0.61,0.36,1)',fill:'forwards'}).finished.then(()=>p.remove());}}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function target(){const slots=hw.querySelectorAll('.hanger-slot');const sr=cs.getBoundingClientRect(),lr=slots[slots.length-1].getBoundingClientRect();return{x:lr.left+lr.width/2-sr.left,y:lr.top+lr.height*.28-sr.top};}

async function run(){
  if(busy)return;busy=true;
  const itm=UPC_ITEMS[ci%UPC_ITEMS.length];ci++;
  uc.innerHTML=makeSVG(itm.svgType,itm.color,itm.color2);
  const sr=cs.getBoundingClientRect();const sx=sr.width/2-36;
  uc.style.cssText=`left:${sx}px;bottom:0;top:auto;width:9%;max-width:72px;opacity:0;position:absolute`;
  uz.classList.add('scanning');step(1);await wait(280);
  uc.style.opacity='1';
  uc.animate([{opacity:0,transform:'translateY(80px) scale(0.65)'},{opacity:1,transform:'translateY(-50px) scale(1)'}],{duration:680,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'});
  await wait(480);step(2);uz.classList.remove('scanning');await wait(260);
  const tg=target();const sy=sr.height-140;
  uc.style.cssText=`left:${sx}px;top:${sy}px;width:9%;max-width:72px;opacity:1;position:absolute`;
  uc.animate([{transform:'translate(0,0) rotate(-5deg)'},{transform:`translate(${tg.x-sx}px,${tg.y-sy}px) rotate(0deg)`}],{duration:720,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'});
  await wait(760);step(3);
  uc.animate([{transform:`translate(${tg.x-sx}px,${tg.y-sy}px) scale(1.08)`},{transform:`translate(${tg.x-sx}px,${tg.y-sy}px) scale(1)`}],{duration:420,easing:'cubic-bezier(0.34,1.56,0.64,1)',fill:'forwards'});
  sparkles(tg.x,tg.y+16);await wait(340);
  const ns=makeSlot(itm,hw.children.length);ns.style.opacity='0';hw.appendChild(ns);
  ns.animate([{opacity:0,transform:'scale(0.8)'},{opacity:1,transform:'scale(1)'}],{duration:350,easing:'cubic-bezier(0.34,1.56,0.64,1)',fill:'forwards'});
  uc.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
  await wait(260);confetti();showToast('Item added to your closet! ✨');
  step(1);await wait(600);busy=false;
}

db.addEventListener('click',run);
uz.addEventListener('click',run);
uz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run();}});
uz.addEventListener('dragover',e=>{e.preventDefault();uz.classList.add('drag');});
['dragleave','drop'].forEach(ev=>uz.addEventListener(ev,e=>{e.preventDefault();uz.classList.remove('drag');if(ev==='drop')run();}));
</script>
</body>
</html>
